{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Edição de Dados de Interessado{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto mb-8">
        <div class="card bg-blk text-white">
            <div class="card-header bg-upd">
                <h1>Edição de Dados de Interessado</h1>
            </div>
            <div class="card-body">
                <form method="post" class="text-light">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="text-center mt-3">
                        <button type="submit" class="btn upd-btn">Alterar</button>
                        <a href="{{ request.META.HTTP_REFERER|default:'#' }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
